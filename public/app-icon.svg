<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1c1917"/>
  <!-- fretboard -->
  <rect x="96" y="64" width="320" height="384" rx="16" fill="#3f2a14"/>
  <!-- frets -->
  <g stroke="#a8a29e" stroke-width="6">
    <line x1="96" y1="128" x2="416" y2="128"/>
    <line x1="96" y1="192" x2="416" y2="192"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="320" x2="416" y2="320"/>
    <line x1="96" y1="384" x2="416" y2="384"/>
  </g>
  <!-- strings -->
  <g stroke="#e7e5e4" stroke-width="3">
    <line x1="146" y1="64" x2="146" y2="448"/>
    <line x1="190" y1="64" x2="190" y2="448"/>
    <line x1="234" y1="64" x2="234" y2="448"/>
    <line x1="278" y1="64" x2="278" y2="448"/>
    <line x1="322" y1="64" x2="322" y2="448"/>
    <line x1="366" y1="64" x2="366" y2="448"/>
  </g>
  <!-- finger dots (a simple chord shape) -->
  <circle cx="190" cy="160" r="22" fill="#863bff"/>
  <circle cx="322" cy="224" r="22" fill="#47bfff"/>
  <circle cx="234" cy="288" r="22" fill="#22c55e"/>
</svg>
